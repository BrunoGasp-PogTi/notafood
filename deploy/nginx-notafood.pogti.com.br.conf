# Configuração do Nginx para notafood.pogti.com.br
server {
    listen 80;
    listen [::]:80;
    server_name notafood.pogti.com.br;

    # Redirecionamento automático HTTP para HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name notafood.pogti.com.br;

    # Certificados SSL (Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/notafood.pogti.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/notafood.pogti.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Limite de upload de foto (até 20MB para fotos de alta resolução da câmera)
    client_max_body_size 20M;

    # Proxy reverso para o Backend NotaFood (porta 6001)
    location / {
        proxy_pass http://127.0.0.1:6001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90;
    }
}
